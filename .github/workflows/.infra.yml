name: Terraform

on:
  workflow_call:
    inputs:
      environment_name:
        description: Deployment environment name
        required: true
        type: string
      command:
        description: Terraform wrapper command to run
        required: true
        default: plan
        type: string
      tfvars_file:
        description: Optional tfvars file path
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform ${{ inputs.command }} (${{ inputs.environment_name }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Make wrapper executable
        shell: bash
        run: chmod +x ./infra/deploy-terraform.sh

      - name: Terraform command
        shell: bash
        env:
          CI: "true"
          TF_VAR_app_env: ${{ inputs.environment_name }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_use_oidc: "true"
          BACKEND_RESOURCE_GROUP: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          BACKEND_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          BACKEND_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME }}
          BACKEND_STATE_KEY: fabric-analytics-api-gateway/${{ inputs.environment_name }}.tfstate
          # Pass workflow_dispatch inputs via env to avoid bash script injection.
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_TFVARS_FILE: ${{ inputs.tfvars_file }}
        run: |
          set -euo pipefail

          # Whitelist the command instead of trusting the input verbatim.
          case "$INPUT_COMMAND" in
            plan|apply) ;;
            *)
              echo "Refusing unsupported command: $INPUT_COMMAND" >&2
              exit 1
              ;;
          esac

          extra_args=()
          if [[ -n "$INPUT_TFVARS_FILE" && -f "$INPUT_TFVARS_FILE" ]]; then
            extra_args+=("-var-file=$INPUT_TFVARS_FILE")
          fi

          ./infra/deploy-terraform.sh "$INPUT_COMMAND" "${extra_args[@]}"
