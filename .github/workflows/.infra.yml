name: Terraform

on:
  workflow_call:
    inputs:
      environment_name:
        description: Deployment environment name
        required: true
        type: string
      command:
        description: Terraform wrapper command to run
        required: true
        default: plan
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform ${{ inputs.command }} (${{ inputs.environment_name }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Make wrapper executable
        shell: bash
        run: chmod +x ./infra/scripts/deploy-terraform.sh ./infra/scripts/deploy-scaled.sh

      - name: Terraform command
        shell: bash
        env:
          CI: "true"
          TF_VAR_app_env: ${{ inputs.environment_name }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_use_oidc: "true"
          # BACKEND_RESOURCE_GROUP is not sensitive (just an RG name) — stored as a
          # GitHub Actions variable so it can be inspected in `if:` conditions.
          BACKEND_RESOURCE_GROUP: ${{ vars.BACKEND_RESOURCE_GROUP }}
          BACKEND_STORAGE_ACCOUNT: ${{ vars.BACKEND_STORAGE_ACCOUNT }}
          BACKEND_CONTAINER_NAME: ${{ vars.BACKEND_CONTAINER_NAME || 'tfstate' }}
          # Pass workflow inputs via env to avoid shell injection.
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          # Guard: backend storage config is required. For plan runs we emit a
          # warning and exit 0 so PRs don't fail when the environment has not
          # been provisioned yet (lint already validates the structure). For
          # apply/destroy we fail fast — never apply without a real state backend.
          if [[ -z "${BACKEND_RESOURCE_GROUP}" || -z "${BACKEND_STORAGE_ACCOUNT}" ]]; then
            if [[ "${INPUT_COMMAND}" == "plan" ]]; then
              echo "::warning::BACKEND_RESOURCE_GROUP or BACKEND_STORAGE_ACCOUNT not configured in the '${INPUT_ENVIRONMENT}' environment — skipping Terraform plan. Set both as GitHub Actions variables on the environment to enable plans."
              exit 0
            else
              echo "::error::BACKEND_RESOURCE_GROUP and BACKEND_STORAGE_ACCOUNT must be set as GitHub Actions variables on the '${INPUT_ENVIRONMENT}' environment before running ${INPUT_COMMAND}."
              exit 1
            fi
          fi
          ./infra/scripts/deploy-terraform.sh "$INPUT_COMMAND" "$INPUT_ENVIRONMENT" --auto-approve
