name: Terraform

on:
  workflow_call:
    inputs:
      environment_name:
        description: Deployment environment name
        required: true
        type: string
      command:
        description: Terraform wrapper command to run
        required: true
        default: plan
        type: string
      tfvars_file:
        description: Optional tfvars file path
        required: false
        default: ""
        type: string
      dab_image:
        description: DAB image to deploy (overrides TF_VAR_dab_image)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform ${{ inputs.command }} (${{ inputs.environment_name }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Setup Container Apps CLI Extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors

      - name: Make wrapper executable
        shell: bash
        run: chmod +x ./infra/deploy-terraform.sh

      - name: Terraform command
        shell: bash
        env:
          CI: "true"
          TF_VAR_create_resource_group: "true"
          TF_VAR_app_env: ${{ inputs.environment_name }}
          TF_VAR_dab_database_type: "dwsql"
          TF_VAR_dab_image: ${{ inputs.dab_image }}
          TF_VAR_dab_sql_connection_string: ${{ secrets.DAB_SQL_CONNECTION_STRING }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_deploy_dab_app: "true"
          TF_VAR_deploy_kong_app: "false"
          TF_VAR_deploy_kong_bootstrap_job: "false"
          TF_VAR_enable_application_gateway: "false"
          TF_VAR_enable_container_apps: "true"
          TF_VAR_enable_front_door: "false"
          TF_VAR_enable_key_vault: "false"
          TF_VAR_enable_kong_key_vault_bootstrap: "false"
          TF_VAR_enable_monitoring: "true"
          TF_VAR_enable_network: "true"
          TF_VAR_use_oidc: "true"
          BACKEND_RESOURCE_GROUP: ${{ secrets.VNET_RESOURCE_GROUP_NAME }}
          BACKEND_STORAGE_ACCOUNT: ${{ vars.STORAGE_ACCOUNT_NAME }}
          TF_VAR_existing_vnet_resource_group_name: ${{ secrets.VNET_RESOURCE_GROUP_NAME }}
          TF_VAR_existing_vnet_name: ${{ secrets.VNET_NAME }}
          BACKEND_CONTAINER_NAME: tfstate
          BACKEND_STATE_KEY: fabric-analytics-api-gateway/${{ inputs.environment_name }}.tfstate
          KONG_KEY_VAULT_NAME: ${{ vars.KONG_KEY_VAULT_NAME }}
          KONG_KEY_VAULT_SECRET_PREFIX: ${{ vars.KONG_KEY_VAULT_SECRET_PREFIX }}
          KONG_ROUTE_HOST: ${{ vars.KONG_ROUTE_HOST }}
          KONG_RUNTIME_GROUP_NAME: ${{ vars.KONG_RUNTIME_GROUP_NAME }}
          KONG_SDX_CONTROL_URL: ${{ vars.KONG_SDX_CONTROL_URL }}
          SDX_BOOTSTRAP_TOKEN: ${{ secrets.SDX_BOOTSTRAP_TOKEN }}
          SDX_CLIENT_CA_URL: ${{ vars.SDX_CLIENT_CA_URL }}
          SDX_SERVER_IP_SAN: ${{ vars.SDX_SERVER_IP_SAN }}
          # Pass workflow_dispatch inputs via env to avoid bash script injection.
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          INPUT_COMMAND: ${{ inputs.command }}
          TFVARS_FILE: ${{ inputs.tfvars_file }}
        run: |
          set -euo pipefail
          ./infra/deploy-terraform.sh "$INPUT_COMMAND"
