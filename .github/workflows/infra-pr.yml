name: Infra PR

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/**
      - .github/copilot-instructions.md
      - .github/skills/**

permissions:
  contents: read

concurrency:
  group: infra-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    uses: ./.github/workflows/.detect-changes.yml
    with:
      paths: |
        infra/**
        .github/workflows/**
        .github/copilot-instructions.md
        .github/skills/**
      comparison: pr
      default_changed: true

  lint:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/.infra-lint.yml
